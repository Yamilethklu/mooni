<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MOONI - Dashboard Unificado</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <!-- Sección Izquierda: WhatsApp -->
        <div class="panel">
            <h2>WhatsApp Emulador</h2>
            <input id="tel" placeholder="Teléfono">
            <input id="orig" placeholder="Origen">
            <input id="dest" placeholder="Destino">
            <input id="oferta" placeholder="Oferta">
            <button onclick="solicitar()">Enviar Solicitud</button>
            <div class="chat-bubble">Bot: Hola! ¿A dónde vamos hoy?</div>
        </div>
        <!-- Sección Central: Monitor -->
        <div class="panel">
            <h2>Monitor de Flujo</h2>
            <div class="node">1. Webhook Recibido</div>
            <div class="node">2. Google Routes API</div>
            <div class="node">3. Algoritmo Tarifa</div>
            <div class="node">4. Persistencia DB</div>
            <pre id="console" style="font-size: 0.7em;"></pre>
        </div>
        <!-- Sección Derecha: Tabla -->
        <div class="panel">
            <h2>Control de Viajes</h2>
            <table>
                <thead><tr><th>ID</th><th>Tel</th><th>KM</th><th>Precio</th><th>Estado</th><th>Acción</th></tr></thead>
                <tbody id="viajes-body"></tbody>
            </table>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
